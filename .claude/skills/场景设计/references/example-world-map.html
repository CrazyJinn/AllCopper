<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>大地图示例 - 废土世界地图</title>
  <!--
    大地图 (World Map)

    用途：游戏世界地图、区域导航地图
    特点：俯视角全景，标注可点击的地点/区域
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="map_world_001"
       description="废土世界地图：末世废土世界，支离破碎的大陆，油画风格，俯视角，黄褐色调废土风格，均匀光照略带黄昏感">

    <div description="废土地图底图：黄褐色荒原，断裂的道路网络，干涸的河床，散布的废墟"
         style="left:0;top:0;width:100%;height:100%;z-index:1"></div>

    <div description="地图装饰：飘浮的沙尘云层，核冬天残留的灰色云团"
         style="left:0;top:0;width:100%;height:100%;z-index:2"></div>

    <div description="骑士团城镇图标：黑白灰建筑群，外骨骼标志，城墙围护的据点"
         style="left:15%;top:30%;width:8%;height:12%;z-index:3"></div>

    <div description="秘术协会城镇图标：紫色魔法塔楼，发光符文环绕，神秘氛围"
         style="left:70%;top:55%;width:8%;height:12%;z-index:3"></div>

    <div description="废土区域图标：荒芜的沙地，散落的残骸，危险标记"
         style="left:40%;top:45%;width:20%;height:15%;z-index:3"></div>

    <div description="变异森林图标：扭曲的紫色树冠，发光孢子，危险植被"
         style="left:75%;top:35%;width:10%;height:12%;z-index:3"></div>

    <div description="城市废墟图标：倒塌的摩天楼轮廓，瓦砾堆积，科技残留"
         style="left:55%;top:25%;width:12%;height:14%;z-index:3"></div>

  </div>
</body>
</html>
