<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>对话背景示例 - 骑士团城镇对话</title>
  <!--
    对话背景 (Dialog Background)

    用途：对话系统的背景图
    特点：简洁，不干扰角色立绘，氛围感强，暗示对话发生地点
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="dialog_knight_001"
       description="骑士团城镇广场对话背景：秩序井然的骑士团据点，军事化氛围，油画风格，平视视角，黑白灰配色冷色调，侧光照明，暗角效果">

    <div description="天空区域：灰蒙蒙的天空，云层厚重"
         style="left:0;top:0;width:100%;height:30%;z-index:1"></div>

    <div description="远景：断裂的高楼轮廓，远处废墟散布"
         style="left:0;top:15%;width:100%;height:25%;z-index:1"></div>

    <div description="左侧建筑：黑白灰配色的军事建筑，瞭望塔底部，金属结构"
         style="left:0;top:20%;width:30%;height:60%;z-index:2"></div>

    <div description="右侧建筑：训练场地，骑士团旗帜飘扬，建筑墙面"
         style="left:70%;top:25%;width:30%;height:55%;z-index:2"></div>

    <div description="中央地面：石板路面，路灯照明，简洁空旷（角色立绘区）"
         style="left:25%;top:50%;width:50%;height:40%;z-index:1"></div>

    <div description="氛围效果：飘浮的灰尘粒子，整体模糊处理，暗角效果"
         style="left:0;top:0;width:100%;height:100%;z-index:3"></div>

  </div>
</body>
</html>
