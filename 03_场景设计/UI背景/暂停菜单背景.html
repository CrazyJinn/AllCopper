<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>UI背景 - 暂停菜单</title>
  <!--
    UI背景 (UI Background)

    用途：暂停菜单界面的背景
    特点：游戏画面模糊/变暗，半透明遮罩
    尺寸：1920×1080px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="ui_pause_001"
       description="暂停菜单背景：游戏画面模糊变暗效果，半透明黑色遮罩，油画风格，暗色调，中心亮区">

    <div description="模糊游戏画面：当前游戏场景的模糊版本"
         style="left:0;top:0;width:100%;height:100%;z-index:1"></div>

    <div description="半透明遮罩：黑色半透明遮罩，50%透明度"
         style="left:0;top:0;width:100%;height:100%;z-index:2"></div>

    <div description="中心亮区：菜单区域的微弱光照"
         style="left:30%;top:30%;width:40%;height:40%;z-index:3"></div>

    <div description="暗角效果：四周更暗，突出中心"
         style="left:0;top:0;width:100%;height:100%;z-index:4"></div>

    <div description="菜单面板区域：中央位置，预留位置"
         style="left:35%;top:35%;width:30%;height:30%;z-index:5"></div>

  </div>
</body>
</html>
