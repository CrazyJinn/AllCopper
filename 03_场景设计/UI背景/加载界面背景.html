<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>UI背景 - 加载界面</title>
  <!--
    UI背景 (UI Background)

    用途：加载/读条界面的背景
    特点：可展示游戏提示/世界设定，动态元素
    尺寸：1920×1080px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="ui_loading_001"
       description="加载界面背景：末世废土氛围，油画风格，暗色调，简洁背景，突出提示文字和加载进度">

    <div description="背景：废土黄昏景象，断裂建筑轮廓，沙尘飘动"
         style="left:0;top:0;width:100%;height:100%;z-index:1"></div>

    <div description="暗角效果：四周渐暗，中央区域留亮"
         style="left:0;top:0;width:100%;height:100%;z-index:2"></div>

    <div description="游戏Logo：中央上方，小型Logo"
         style="left:40%;top:20%;width:20%;height:15%;z-index:3"></div>

    <div description="提示文字区域：中央位置，游戏提示/世界设定"
         style="left:25%;top:45%;width:50%;height:20%;z-index:3"></div>

    <div description="加载进度条背景：底部进度条背景"
         style="left:25%;top:80%;width:50%;height:3%;z-index:4"></div>

    <div description="加载进度条：底部进度条，动态填充"
         style="left:25%;top:80%;width:50%;height:3%;z-index:5"></div>

    <div description="加载文字：底部加载提示文字"
         style="left:40%;top:85%;width:20%;height:5%;z-index:4"></div>

    <div description="尘埃粒子：飘浮的灰尘粒子效果"
         style="left:0;top:0;width:100%;height:100%;z-index:6"></div>

  </div>
</body>
</html>
