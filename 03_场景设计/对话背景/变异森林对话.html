<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>对话背景 - 变异森林</title>
  <!--
    对话背景 (Dialogue Background)

    用途：对话系统背景图
    特点：简洁，突出角色立绘，氛围感
    尺寸：1920×1080px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; background: #1a1a2e; }
    body > div > div { position: absolute; border: 2px dashed rgba(255,255,255,0.6); background: rgba(100,200,100,0.15); display: flex; align-items: flex-start; justify-content: flex-start; padding: 4px 8px; font-size: 11px; color: #fff; text-shadow: 0 0 3px #000; font-family: monospace; }
  </style>
</head>
<body>
  <div id="dialog_forest_001"
       description="变异森林对话背景：阴森危险的变异森林，油画风格，平视视角，绿色紫色调昏暗，孢子发光，雾气弥漫，暗角效果">

    <div description="天空区域：被树冠遮挡的昏暗天空，透过的散射光"
         style="left:0;top:0;width:100%;height:25%;z-index:1">天空区域 z1</div>

    <div description="远景：扭曲的变异巨树林，紫色树冠，发光孢子"
         style="left:0;top:15%;width:100%;height:40%;z-index:2">远景 z2</div>

    <div description="中景：腐烂落叶层，藤蔓垂挂，发光蘑菇"
         style="left:0;top:45%;width:100%;height:30%;z-index:3">中景 z3</div>

    <div description="近景地面：腐烂植被，泥泞地面，骸骨"
         style="left:0;top:70%;width:100%;height:30%;z-index:4">近景地面 z4</div>

    <div description="巨树干-左：扭曲的变异树干，紫色纹路"
         style="left:5%;top:20%;width:12%;height:50%;z-index:3">巨树干-左 z3</div>

    <div description="巨树干-右：扭曲的变异树干，发光苔藓"
         style="left:80%;top:15%;width:15%;height:55%;z-index:3">巨树干-右 z3</div>

    <div description="发光蘑菇：地面上的发光真菌，紫绿色光"
         style="left:25%;top:60%;width:8%;height:12%;z-index:4">发光蘑菇 z4</div>

    <div description="藤蔓帘幕：垂挂的变异藤蔓"
         style="left:45%;top:10%;width:15%;height:40%;z-index:2">藤蔓帘幕 z2</div>

    <div description="孢子飘浮：发光的孢子粒子"
         style="left:0;top:0;width:100%;height:100%;z-index:5">孢子飘浮 z5 (全屏)</div>

    <div description="雾气效果：森林中的浓雾"
         style="left:0;top:30%;width:100%;height:50%;z-index:5">雾气效果 z5</div>

    <div description="暗角效果：四周渐暗，中央区域留亮"
         style="left:0;top:0;width:100%;height:100%;z-index:6">暗角效果 z6 (全屏)</div>

  </div>
</body>
</html>
