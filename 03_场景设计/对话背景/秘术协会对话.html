<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>对话背景 - 秘术协会</title>
  <!--
    对话背景 (Dialogue Background)

    用途：对话系统背景图
    特点：简洁，突出角色立绘，氛围感
    尺寸：1920×1080px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="dialog_magic_001"
       description="秘术协会对话背景：神秘优雅的魔法协会，紫色金色调，油画风格，平视视角，魔法光源照明，神秘氛围，暗角效果">

    <div description="天空区域：紫色调黄昏天空，魔法能量云层，悬浮光点"
         style="left:0;top:0;width:100%;height:30%;z-index:1"></div>

    <div description="远景建筑：紫色魔法塔楼轮廓，符文发光，水晶簇"
         style="left:0;top:20%;width:100%;height:35%;z-index:2"></div>

    <div description="中景广场：魔法石板地面，发光符文纹路，紫色花瓣"
         style="left:0;top:45%;width:100%;height:30%;z-index:3"></div>

    <div description="近景地面：魔法石板细节，符文发光效果"
         style="left:0;top:70%;width:100%;height:30%;z-index:4"></div>

    <div description="魔法塔剪影：中央远处的魔法塔轮廓，符文环绕"
         style="left:40%;top:10%;width:20%;height:45%;z-index:3"></div>

    <div description="悬浮灯笼：紫色蓝色光点装饰"
         style="left:20%;top:30%;width:5%;height:15%;z-index:3"></div>

    <div description="符文柱：发光的符文石柱"
         style="left:75%;top:35%;width:6%;height:25%;z-index:3"></div>

    <div description="水晶簇装饰：发光的紫色水晶"
         style="left:10%;top:50%;width:8%;height:15%;z-index:4"></div>

    <div description="魔法能量粒子：飘浮的魔法能量效果"
         style="left:0;top:0;width:100%;height:100%;z-index:5"></div>

    <div description="暗角效果：四周渐暗，中央区域留亮"
         style="left:0;top:0;width:100%;height:100%;z-index:6"></div>

  </div>
</body>
</html>
