<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>对话背景 - 废土荒原</title>
  <!--
    对话背景 (Dialogue Background)

    用途：对话系统背景图
    特点：简洁，突出角色立绘，氛围感
    尺寸：1920×1080px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="dialog_wasteland_001"
       description="废土荒原对话背景：荒凉危险的末世废土，油画风格，平视视角，黄褐色调，刺眼阳光或月光，沙尘飘动，暗角效果">

    <div description="天空区域：黄褐色天空，沙尘云层，核冬天残留灰云"
         style="left:0;top:0;width:100%;height:30%;z-index:1"></div>

    <div description="远景：荒原地平线，断裂道路，倒塌建筑轮廓"
         style="left:0;top:20%;width:100%;height:35%;z-index:2"></div>

    <div description="中景：沙丘起伏，残骸散布，枯树矗立"
         style="left:0;top:45%;width:100%;height:30%;z-index:3"></div>

    <div description="近景地面：沙土地面，碎石散布，骸骨残骸"
         style="left:0;top:70%;width:100%;height:30%;z-index:4"></div>

    <div description="废弃车辆残骸：生锈的车辆轮廓"
         style="left:70%;top:40%;width:12%;height:15%;z-index:3"></div>

    <div description="枯树剪影：枯死的扭曲树木"
         style="left:15%;top:25%;width:8%;height:30%;z-index:3"></div>

    <div description="断裂道路：废弃的公路残段"
         style="left:30%;top:55%;width:40%;height:10%;z-index:3"></div>

    <div description="沙尘效果：飘浮的沙尘粒子"
         style="left:0;top:0;width:100%;height:100%;z-index:5"></div>

    <div description="暗角效果：四周渐暗，中央区域留亮"
         style="left:0;top:0;width:100%;height:100%;z-index:6"></div>

  </div>
</body>
</html>
