<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>对话背景 - 骑士团城镇广场</title>
  <!--
    对话背景 (Dialogue Background)

    用途：对话系统背景图
    特点：简洁，突出角色立绘，氛围感
    尺寸：1920×1080px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="dialog_knight_001"
       description="骑士团城镇广场对话背景：秩序井然的骑士团据点，军事化氛围，油画风格，平视视角，黑白灰配色冷色调，侧光照明，暗角效果">

    <div description="天空区域：灰蒙蒙的天空，云层厚重，微弱阳光穿透"
         style="left:0;top:0;width:100%;height:30%;z-index:1"></div>

    <div description="远景建筑：黑白灰建筑群轮廓，瞭望塔剪影，城墙轮廓"
         style="left:0;top:20%;width:100%;height:35%;z-index:2"></div>

    <div description="中景广场：石板广场地面，路灯排列，旗帜飘扬"
         style="left:0;top:45%;width:100%;height:30%;z-index:3"></div>

    <div description="近景地面：石板路细节，裂缝纹理，灰尘覆盖"
         style="left:0;top:70%;width:100%;height:30%;z-index:4"></div>

    <div description="瞭望塔剪影：右侧远处的瞭望塔轮廓"
         style="left:75%;top:15%;width:15%;height:40%;z-index:3"></div>

    <div description="旗帜装饰：黑白灰三色旗帜，风中飘扬"
         style="left:25%;top:25%;width:8%;height:25%;z-index:3"></div>

    <div description="路灯照明：沿路分布的路灯，微弱暖光"
         style="left:15%;top:40%;width:5%;height:25%;z-index:4"></div>

    <div description="暗角效果：四周渐暗，中央区域留亮"
         style="left:0;top:0;width:100%;height:100%;z-index:5"></div>

    <div description="灰尘粒子：飘浮的灰尘颗粒，微弱光线中可见"
         style="left:0;top:0;width:100%;height:100%;z-index:6"></div>

  </div>
</body>
</html>
