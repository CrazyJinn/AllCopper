<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>副本-隐藏房</title>
  <!--
    室内游戏场景 (Indoor Scene)

    用途：副本隐藏房间，特殊奖励
    特点：小空间，神秘氛围，宝箱或隐藏Boss
    尺寸：768×768px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="dungeon_secret_001"
       description="副本隐藏房：神秘的小型房间，特殊材质，油画风格，俯视角，紫色金色调神秘感，魔法光源，惊喜氛围">

    <div description="地面：特殊材质地面，神秘符文，发光纹路"
         style="left:12%;top:12%;width:76%;height:76%;z-index:1"></div>

    <div description="神秘符文：地面上的发光符文图案"
         style="left:30%;top:35%;width:40%;height:30%;z-index:1"></div>

    <div description="墙壁-上：神秘符文装饰的墙壁"
         style="left:0;top:0;width:100%;height:12%;z-index:3"></div>

    <div description="墙壁-下：神秘符文装饰的墙壁，单向入口"
         style="left:0;top:88%;width:100%;height:12%;z-index:3"></div>

    <div description="墙壁-左：发光水晶装饰的墙壁"
         style="left:0;top:0;width:12%;height:100%;z-index:3"></div>

    <div description="墙壁-右：发光水晶装饰的墙壁"
         style="left:88%;top:0;width:12%;height:100%;z-index:3"></div>

    <div description="入口门-单向：从普通房进入，无法返回"
         style="left:45%;top:88%;width:10%;height:8%;z-index:4"></div>

    <div description="稀有宝箱：中央位置的稀有宝箱，发光效果"
         style="left:42%;top:45%;width:16%;height:14%;z-index:4"></div>

    <div description="隐藏Boss区域：50%概率出现隐藏Boss"
         style="left:35%;top:35%;width:30%;height:30%;z-index:1"></div>

    <div description="特殊道具收集物：散布的稀有道具"
         style="left:25%;top:55%;width:8%;height:6%;z-index:4"></div>

    <div description="特殊道具收集物：散布的稀有道具"
         style="left:67%;top:55%;width:8%;height:6%;z-index:4"></div>

    <div description="发光水晶装饰：墙壁上的发光水晶"
         style="left:5%;top:45%;width:6%;height:10%;z-index:4"></div>

    <div description="发光水晶装饰：墙壁上的发光水晶"
         style="left:89%;top:45%;width:6%;height:10%;z-index:4"></div>

    <div description="神秘光效：房间内的神秘光线效果"
         style="left:20%;top:20%;width:60%;height:60%;z-index:2"></div>

  </div>
</body>
</html>
