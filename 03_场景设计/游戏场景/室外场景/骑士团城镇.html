<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>骑士团城镇</title>
  <!--
    室外游戏场景 (Outdoor Scene)

    用途：玩家实际探索的室外场景
    特点：完整的远中近景分层，包含可交互区域，俯视角
    尺寸：4096×4096px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="scene_knight_town_001"
       description="骑士团城镇：末世废土风格，秩序井然的军事化据点，油画风格，俯视角，黑白灰配色冷色调，侧上方日光偏冷色调">

    <div description="远景：灰蒙蒙的天空，断裂的高楼轮廓，远处废墟散布"
         style="left:0;top:0;width:100%;height:40%;z-index:1"></div>

    <div description="中景：黑白灰建筑群，外骨骼展示台，训练场地"
         style="left:0;top:25%;width:100%;height:50%;z-index:2"></div>

    <div description="近景：石板路面，路灯照明，补给站招牌"
         style="left:0;top:60%;width:100%;height:40%;z-index:3"></div>

    <div description="瞭望塔：高耸的金属结构塔楼，探照灯扫射"
         style="left:80%;top:20%;width:10%;height:25%;z-index:4"></div>

    <div description="骑士团旗帜：黑白灰三色旗帜，在风中飘扬"
         style="left:30%;top:35%;width:5%;height:15%;z-index:4"></div>

    <div description="中央广场：NPC康拉德站立位置，角色交互区域"
         style="left:45%;top:55%;width:8%;height:12%;z-index:5"></div>

    <div description="商店建筑：带有商品标志的建筑入口，铁匠铺"
         style="left:20%;top:40%;width:12%;height:18%;z-index:5"></div>

    <div description="补给站建筑：消耗品商店入口"
         style="left:15%;top:55%;width:10%;height:15%;z-index:5"></div>

    <div description="任务板：接取任务的公告板"
         style="left:55%;top:50%;width:4%;height:8%;z-index:5"></div>

    <div description="城镇出口-北门：通往废土的大门，守卫把守"
         style="left:45%;top:5%;width:10%;height:10%;z-index:5"></div>

    <div description="副本入口：东区通往地下副本的入口"
         style="left:85%;top:45%;width:8%;height:12%;z-index:5"></div>

    <div description="训练场：开阔的演练场地，武器架"
         style="left:65%;top:55%;width:15%;height:18%;z-index:4"></div>

    <div description="路灯装饰：沿路分布的路灯，微弱照明"
         style="left:35%;top:65%;width:3%;height:8%;z-index:4"></div>

    <div description="沙袋掩体：防御工事，装饰性碰撞体"
         style="left:50%;top:75%;width:6%;height:5%;z-index:4"></div>

  </div>
</body>
</html>
