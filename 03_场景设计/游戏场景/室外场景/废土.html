<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>废土</title>
  <!--
    室外游戏场景 (Outdoor Scene)

    用途：玩家实际探索的废土战斗区域
    特点：完整的远中近景分层，包含刷怪点和可交互区域，俯视角
    尺寸：8192×8192px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="scene_wasteland_001"
       description="废土：荒凉危险的末世战场，油画风格，俯视角，黄褐色调，刺眼阳光或月光，沙尘飘动">

    <div description="远景：黄褐色荒原地平线，断裂的道路，干涸河床"
         style="left:0;top:0;width:100%;height:40%;z-index:1"></div>

    <div description="中景：沙丘起伏，残骸散布，枯树矗立"
         style="left:0;top:25%;width:100%;height:50%;z-index:2"></div>

    <div description="近景：沙土地面，碎石散布，骸骨残骸"
         style="left:0;top:60%;width:100%;height:40%;z-index:3"></div>

    <div description="残骸墙：大型阻挡物，废墟墙壁"
         style="left:20%;top:40%;width:15%;height:10%;z-index:4"></div>

    <div description="废弃车辆：生锈的车辆残骸，可碰撞"
         style="left:60%;top:55%;width:8%;height:6%;z-index:4"></div>

    <div description="枯树：枯死的扭曲树木"
         style="left:40%;top:45%;width:5%;height:10%;z-index:4"></div>

    <div description="油桶：废弃油桶，可破坏"
         style="left:75%;top:65%;width:3%;height:4%;z-index:4"></div>

    <div description="刷怪点-西南区：辐射巨鼠群刷新点"
         style="left:15%;top:70%;width:12%;height:10%;z-index:3"></div>

    <div description="刷怪点-东北区：钢鬃野猪刷新点"
         style="left:75%;top:25%;width:10%;height:8%;z-index:3"></div>

    <div description="刷怪点-中央区：骨翼鸦群刷新点"
         style="left:45%;top:50%;width:12%;height:10%;z-index:3"></div>

    <div description="资源箱：随机物品收集点"
         style="left:55%;top:40%;width:4%;height:5%;z-index:5"></div>

    <div description="纽扣电池：货币拾取点"
         style="left:30%;top:60%;width:2%;height:3%;z-index:5"></div>

    <div description="返回骑士团城镇传送门：西门方向"
         style="left:5%;top:45%;width:6%;height:8%;z-index:5"></div>

    <div description="返回秘术协会传送门：南门方向"
         style="left:45%;top:92%;width:6%;height:6%;z-index:5"></div>

    <div description="通往城市废墟入口：东北方"
         style="left:85%;top:20%;width:6%;height:8%;z-index:5"></div>

    <div description="通往变异森林入口：东方"
         style="left:92%;top:50%;width:6%;height:8%;z-index:5"></div>

    <div description="副本入口：散布的地下入口"
         style="left:35%;top:35%;width:5%;height:6%;z-index:5"></div>

    <div description="辐射危险区：持续辐射伤害区域"
         style="left:65%;top:75%;width:10%;height:12%;z-index:2"></div>

    <div description="沙尘暴效果：飘浮的沙尘粒子"
         style="left:0;top:0;width:100%;height:100%;z-index:6"></div>

  </div>
</body>
</html>
