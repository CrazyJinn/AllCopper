<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>骑士团领地地图</title>
  <!--
    区域地图 (Region Map)

    用途：骑士团控制区域导航
    特点：俯视角，科技阵营风格
    尺寸：4096×4096px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="map_knight_001"
       description="骑士团领地地图：科技阵营控制区域，秩序井然的军事化管理，油画风格，俯视角，黑白灰配色冷色调，侧上方日光偏冷">

    <div description="地图底图：水泥地面纹理，石板路网络，金属补丁，秩序感强"
         style="left:0;top:0;width:100%;height:100%;z-index:1"></div>

    <div description="城镇中心：骑士团总部建筑，高耸的瞭望塔，黑白灰三色旗帜飘扬"
         style="left:40%;top:35%;width:20%;height:25%;z-index:3"></div>

    <div description="商业区：商店建筑群，铁匠铺，补给站"
         style="left:60%;top:40%;width:15%;height:20%;z-index:3"></div>

    <div description="住宅区：整齐排列的营房，灰色建筑"
         style="left:20%;top:45%;width:15%;height:18%;z-index:3"></div>

    <div description="训练场：开阔的演练场地，武器架，训练假人"
         style="left:55%;top:60%;width:18%;height:15%;z-index:3"></div>

    <div description="北门出口：通往废土的大门，守卫岗哨"
         style="left:45%;top:5%;width:10%;height:8%;z-index:4"></div>

    <div description="东区副本入口：通往地下副本的入口"
         style="left:85%;top:50%;width:8%;height:10%;z-index:4"></div>

    <div description="任务板区域：中央广场任务接取点"
         style="left:48%;top:50%;width:5%;height:6%;z-index:5"></div>

    <div description="NPC康拉德位置：主线NPC站立点"
         style="left:50%;top:55%;width:4%;height:5%;z-index:5"></div>

  </div>
</body>
</html>
