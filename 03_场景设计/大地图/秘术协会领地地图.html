<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>秘术协会领地地图</title>
  <!--
    区域地图 (Region Map)

    用途：秘术协会控制区域导航
    特点：俯视角，魔法阵营风格
    尺寸：4096×4096px
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    body > div { position: relative; width: 100%; height: 100%; }
    body > div > div { position: absolute; }
  </style>
</head>
<body>
  <div id="map_magic_001"
       description="秘术协会领地地图：魔法阵营控制区域，神秘优雅的魔法气息，油画风格，俯视角，紫色金色调，魔法光源照明">

    <div description="地图底图：魔法石板地面，紫色晶体纹理，发光符文纹路"
         style="left:0;top:0;width:100%;height:100%;z-index:1"></div>

    <div description="魔法能量流动：地面上的发光魔法纹路，能量流动效果"
         style="left:0;top:0;width:100%;height:100%;z-index:2"></div>

    <div description="中央魔法塔：高耸的紫色魔法塔，符文环绕，悬浮光点"
         style="left:40%;top:30%;width:20%;height:30%;z-index:3"></div>

    <div description="魔法商店区：东区建筑群，紫色灯笼照明"
         style="left:65%;top:40%;width:15%;height:18%;z-index:3"></div>

    <div description="炼金工坊区：西区建筑群，炼金烟雾缭绕"
         style="left:15%;top:45%;width:15%;height:18%;z-index:3"></div>

    <div description="传送阵区域：中央广场传送设施，魔法阵发光"
         style="left:45%;top:55%;width:10%;height:12%;z-index:4"></div>

    <div description="南门出口：通往废土的大门，符文守卫"
         style="left:45%;top:90%;width:10%;height:8%;z-index:4"></div>

    <div description="东门出口：通往变异森林的大门"
         style="left:90%;top:50%;width:8%;height:10%;z-index:4"></div>

    <div description="北区副本入口：通往地下副本的隐藏入口"
         style="left:50%;top:10%;width:8%;height:8%;z-index:4"></div>

    <div description="NPC渊宇位置：主线NPC站立点，魔法阵中央"
         style="left:48%;top:60%;width:4%;height:5%;z-index:5"></div>

    <div description="水晶簇装饰：发光的紫色水晶簇"
         style="left:25%;top:35%;width:6%;height:8%;z-index:3"></div>

    <div description="悬浮灯笼：紫色蓝色光点散布"
         style="left:70%;top:30%;width:4%;height:5%;z-index:3"></div>

  </div>
</body>
</html>
